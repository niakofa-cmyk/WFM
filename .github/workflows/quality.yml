name: Workspace quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wfm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wfm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wfm_ci
      # Synthetic values let Clerk middleware exercise unauthenticated API guards.
      # They are not valid production credentials and do not grant access.
      CLERK_SECRET_KEY: sk_test_Y2xlcmsuZGV2JA$dummy
      CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZGV2JA
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZGV2JA
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply schema to clean PostgreSQL
        run: pnpm --filter @workspace/db run push
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
      - name: Build all artifacts
        run: pnpm run build
