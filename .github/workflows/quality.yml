name: Workspace quality

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wfm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wfm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wfm_ci
      # Synthetic values let Clerk middleware exercise unauthenticated API guards.
      # They are not valid production credentials and do not grant access.
      CLERK_SECRET_KEY: sk_test_Y2xlcmsuZGV2JA$dummy
      CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZGV2JA
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZGV2JA
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply schema to clean PostgreSQL
        run: pnpm --filter @workspace/db run push
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
      - name: Build all artifacts
        run: pnpm run build

  verify-staging-evidence:
    name: Verify staging evidence
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live staging evidence
        if: github.head_ref == 'staging'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-staging-promotion.mjs
      - name: Test build-only gate rules
        if: github.head_ref != 'staging'
        run: node --test scripts/verify-build-only-promotion.test.mjs
      - name: Verify pnpm-only build change
        if: github.head_ref != 'staging'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-build-only-promotion.mjs
      - name: Set up pinned pnpm
        if: github.head_ref != 'staging'
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Verify frozen workspace install
        if: github.head_ref != 'staging'
        run: pnpm install --frozen-lockfile
