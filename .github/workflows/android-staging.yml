name: Android staging APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'artifacts/war-for-mars/android/**'
      - 'scripts/android-*'
      - '.github/workflows/android-staging.yml'
  pull_request:
    paths:
      - 'artifacts/war-for-mars/android/**'
      - 'scripts/android-*'
      - '.github/workflows/android-staging.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Android configuration and association generator
        run: node --test scripts/android-app.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and verify staging app
        working-directory: artifacts/war-for-mars/android
        run: gradle --no-daemon :app:testStagingDebugUnitTest :app:lintStagingDebug :app:assembleStagingDebug
      - name: Prepare public domain-association candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-artifacts/android
          apk=artifacts/war-for-mars/android/app/build/outputs/apk/staging/debug/app-staging-debug.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" > generated-artifacts/android/public-certificate.txt
          digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' generated-artifacts/android/public-certificate.txt)"
          fingerprint="$(printf '%s' "$digest" | sed 's/../&:/g; s/:$//')"
          node scripts/android-assetlinks.mjs "$fingerprint" > generated-artifacts/android/assetlinks-candidate.json
          cp "$apk" generated-artifacts/android/wfm-staging.apk
          sha256sum generated-artifacts/android/wfm-staging.apk > generated-artifacts/android/apk-sha256.txt
      - name: Upload APK and public association candidate
        uses: actions/upload-artifact@v4
        with:
          name: wfm-android-staging-${{ github.sha }}
          path: generated-artifacts/android/
          retention-days: 7
      - name: Upload unit and lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfm-android-reports-${{ github.sha }}
          path: artifacts/war-for-mars/android/app/build/reports/
          retention-days: 7
