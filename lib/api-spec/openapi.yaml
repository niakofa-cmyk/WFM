openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: progression
    description: Authenticated player profile and campaign progression
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Check database readiness
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessCheckResponse"
        "503":
          description: API is running but the database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessCheckResponse"
  /game/profile:
    get:
      operationId: getGameProfile
      tags: [progression]
      summary: Get the authenticated player's progression
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameProfile"
        "401":
          description: Authentication required
  /game/leaderboard:
    get:
      operationId: getPublicWingLeaderboard
      tags: [public-leaderboard]
      summary: Get the public opt-in Wing credit leaderboard
      description: Returns only callsigns and aggregate server-verified Wing reward credits.
      responses:
        "200":
          description: Public Wing leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWingLeaderboardResponse"
  /game/profile/leaderboard:
    patch:
      operationId: updateLeaderboardProfile
      tags: [progression]
      summary: Set the authenticated player's public leaderboard preference
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaderboardProfileUpdateInput"
      responses:
        "200":
          description: Updated player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameProfile"
        "400":
          description: Invalid callsign or preference
        "401":
          description: Authentication required
  /game/profile/loadout:
    patch:
      operationId: updateLoadout
      tags: [progression]
      summary: Save the authenticated player's selected faction and hull
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadoutInput"
      responses:
        "200":
          description: Updated player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameProfile"
        "400":
          description: Invalid ship or faction pairing
        "401":
          description: Authentication required
  /game/profile/control-scheme:
    patch:
      operationId: updateControlScheme
      tags: [progression]
      summary: Save the authenticated player's control scheme
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlSchemeInput"
      responses:
        "200":
          description: Updated player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameProfile"
        "400":
          description: Invalid control scheme
        "401":
          description: Authentication required
  /game/profile/actions:
    post:
      operationId: applyProgressionAction
      tags: [progression]
      summary: Buy cargo, sell cargo, or refit using server-owned credits
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressionActionInput"
      responses:
        "200":
          description: Idempotent action result and current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressionActionResult"
        "400":
          description: Invalid or unaffordable action
        "401":
          description: Authentication required
  /strikes/start:
    post:
      operationId: startStrike
      tags: [progression]
      summary: Start a server-issued single-player sortie
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrikeStartInput"
      responses:
        "201":
          description: Server-owned run configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrikeRun"
        "400":
          description: Invalid or locked campaign selection
        "401":
          description: Authentication required
  /strikes/{runId}/claim:
    post:
      operationId: claimStrike
      tags: [progression]
      summary: Adjudicate a server-issued run and grant progression exactly once
      security:
        - ClerkSession: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrikeClaimInput"
      responses:
        "200":
          description: Stored idempotent result and current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrikeClaimResult"
        "400":
          description: Invalid replay
        "401":
          description: Authentication required
        "404":
          description: Run not found for this player
        "409":
          description: Run expired or profile changed after the run began
  /market:
    get:
      operationId: getMarket
      tags: [progression]
      summary: Get the shared station market and the player's holdings
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Shared price book, inventory, and recent transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"
        "401":
          description: Authentication required
  /market/trades:
    post:
      operationId: tradeMarket
      tags: [progression]
      summary: Atomically buy or sell goods against shared market state
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketTradeInput"
      responses:
        "200":
          description: Stored transaction and refreshed shared market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTradeResult"
        "400":
          description: Invalid or unaffordable trade
        "401":
          description: Authentication required
        "409":
          description: Idempotency key conflict
  /world/services:
    post:
      operationId: executeWorldService
      tags: [World]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorldServiceInput" }
      responses:
        "200":
          description: Server-validated station or field activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldServiceResult" }
  /world:
    get:
      operationId: getWorld
      tags: [progression]
      summary: Get persistent map, discoveries, reputation, quests, and world event
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Player view of the persistent universe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldState"
        "401":
          description: Authentication required
  /world/patrols:
    get:
      operationId: getWorldPatrols
      tags: [progression]
      summary: Get server-owned patrols and traffic near the authenticated pilot
      description: Returns persistent AI patrol formations in the authenticated pilot's current and directly connected world locations. Bounded anonymous ship poses and velocities are projected from the server-owned strategic route clock for presentation only. Human presence remains destination-count-only; this endpoint does not return human identities or positions, create active matches, accept combat outcomes, or grant rewards. Clients cannot choose a region or write patrol state.
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Strategic patrol directory for the authenticated pilot's current location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldPatrolDirectory"
        "401":
          description: Authentication required
        "503":
          description: Persistent patrol state is temporarily unavailable
  /world/operations:
    get:
      operationId: getWorldOperations
      tags: [progression]
      summary: Discover public operations in the universe
      description: Returns public operation definitions and only server-confirmed, unexpired public instances. An empty instance list means no public operation is currently hosted.
      responses:
        "200":
          description: Public operation directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationDirectoryResponse"
  /world/exploration/results:
    get:
      operationId: getWorldExplorationResults
      tags: [progression]
      summary: Recover the authenticated pilot's confirmed scout encounter results
      description: Returns only the signed-in pilot's latest server-recorded scout result projections. This endpoint is read-only and never grants currency or accepts client-reported combat results.
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Latest confirmed scout results owned by the authenticated pilot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldExplorationResults"
        "401":
          description: Authentication required
  /world/presence/heartbeat:
    post:
      operationId: heartbeatWorldPresence
      tags: [progression]
      summary: Refresh the signed-in pilot's universe presence
      description: The server derives the destination from persistent world state. Clients cannot submit a location or precise position. Presence expires automatically and is published only as anonymous per-destination counts.
      security:
        - ClerkSession: []
      responses:
        "204":
          description: Presence lease refreshed
        "401":
          description: Authentication required
        "503":
          description: Universe presence is temporarily unavailable
  /world/operations/events:
    get:
      operationId: subscribeWorldOperationEvents
      tags: [progression]
      summary: Subscribe to read-only universe operation status
      description: Server-sent events stream. Each `operations.snapshot` event carries a public OperationDirectoryResponse snapshot with no account identifiers. The stream is read-only; clients cannot publish status through it.
      responses:
        "200":
          description: Read-only server-sent operation status snapshots
          content:
            text/event-stream:
              schema:
                type: string
        "503":
          description: Operation status is temporarily unavailable
  /world/operations/{operationId}/instances:
    post:
      operationId: registerWorldOperationInstance
      tags: [progression]
      summary: Authenticated player registers and enters an operation
      description: Registers only supported on-demand operations at their server-verified world location. Admission is single-seat, server-issued, expires automatically, and cannot grant rewards.
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: operationId
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRegistrationBody"
      responses:
        "200":
          description: Existing idempotent registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRegistrationResponse"
        "201":
          description: New operation registration and admission assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRegistrationResponse"
        "400":
          description: Invalid operation registration
        "401":
          description: Authentication required
        "403":
          description: Player must travel to the operation location
        "409":
          description: Unsupported operation or existing active seat
  /world/operations/instances/{instanceId}/leave:
    post:
      operationId: leaveWorldOperationInstance
      tags: [progression]
      summary: End the authenticated player's operation seat
      security:
        - ClerkSession: []
      parameters:
        - in: path
          name: instanceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Operation seat closed
        "204":
          description: Operation seat closed
        "401":
          description: Authentication required
        "404":
          description: Operation seat not found for this player
  /world/travel:
    post:
      operationId: travelWorld
      tags: [progression]
      summary: Move to an adjacent unlocked location and pay the route fare
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldTravelInput"
      responses:
        "200":
          description: Updated player location and credit balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldTravelResult"
        "400":
          description: Route is unavailable or the player cannot afford it
        "401":
          description: Authentication required
        "409":
          description: Idempotency key conflict
  /world/locations/{locationId}/explore:
    post:
      operationId: exploreLocation
      tags: [progression]
      summary: Record a one-time server-validated location discovery
      security:
        - ClerkSession: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldExploreInput"
      responses:
        "200":
          description: Updated persistent world state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreLocationResult"
        "400":
          description: Location is not unlocked
        "401":
          description: Authentication required
        "404":
          description: Unknown location
  /world/quests/{questId}/actions:
    post:
      operationId: actOnWorldQuest
      tags: [progression]
      summary: Accept or claim a persistent side quest
      security:
        - ClerkSession: []
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldQuestActionInput"
      responses:
        "200":
          description: Updated quest and world state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldQuestActionResult"
        "400":
          description: Quest is locked, incomplete, or already claimed
        "401":
          description: Authentication required
        "404":
          description: Unknown quest
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        database:
          type: boolean
      required: [status, database]
    GameProfile:
      type: object
      required: [credits, faction, shipId, scheme, refit, shieldMk2, prices, hold, paid, pace, mission, cleared, tech, drilled, publicLeaderboardOptIn, publicLeaderboardCallsign, revision]
      properties:
        credits: { type: integer, minimum: 0 }
        faction: { type: string, enum: [accord, ussf] }
        shipId: { type: string, enum: [mandjet, shakuna, sundara, tripura, duskbreaker, sentinel, splitter, glide, wasp, valiant, aegis, bastion, apep, sekhmet, garuda, vajra] }
        scheme: { type: string, enum: [arc, strafe] }
        refit: { type: integer, minimum: 0, maximum: 5 }
        shieldMk2: { type: boolean }
        prices: { $ref: "#/components/schemas/MarketPrices" }
        hold: { type: [string, "null"], enum: [salt, iron, dust, resin, null] }
        paid: { type: integer, minimum: 0 }
        pace: { type: string, enum: [practice, strike] }
        mission: { type: string, enum: [skirmish, contact, beacon, warden, cage] }
        cleared: { type: integer, minimum: 0, maximum: 4 }
        tech: { type: [string, "null"], enum: [stick, barrels, mark, null] }
        drilled: { type: boolean }
        publicLeaderboardOptIn: { type: boolean }
        publicLeaderboardCallsign: { type: [string, "null"], minLength: 3, maxLength: 16, pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{2,15}$" }
        revision: { type: integer, minimum: 0 }
    LeaderboardProfileUpdateInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        callsign: { type: string, minLength: 3, maxLength: 16, pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{2,15}$" }
    PublicWingLeaderboardResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/PublicWingLeaderboardEntry"
    PublicWingLeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, callsign, score]
      properties:
        rank: { type: integer, minimum: 1 }
        callsign: { type: string, minLength: 3, maxLength: 16 }
        score: { type: integer, minimum: 0 }
    ProgressionActionInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, action]
      properties:
        idempotencyKey: { type: string, format: uuid }
        action: { type: string, enum: [refit] }
    LoadoutInput:
      type: object
      additionalProperties: false
      required: [faction, shipId]
      properties:
        faction: { type: string, enum: [accord, ussf] }
        shipId: { type: string, enum: [mandjet, shakuna, sundara, tripura, duskbreaker, sentinel, splitter, glide, wasp, valiant, aegis, bastion, apep, sekhmet, garuda, vajra] }
    ControlSchemeInput:
      type: object
      additionalProperties: false
      required: [scheme]
      properties:
        scheme: { type: string, enum: [arc, strafe] }
    ProgressionActionResult:
      type: object
      required: [profile, transaction]
      properties:
        profile: { $ref: "#/components/schemas/GameProfile" }
        transaction:
          type: object
          required: [id, kind, amount, balanceBefore, balanceAfter]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [refit] }
            amount: { type: integer }
            balanceBefore: { type: integer }
            balanceAfter: { type: integer }
    StrikeStartInput:
      type: object
      additionalProperties: false
      required: [shipId, faction, scheme, pace, mission, tech]
      properties:
        shipId: { type: string, enum: [mandjet, shakuna, sundara, tripura, duskbreaker, sentinel, splitter, glide, wasp, valiant, aegis, bastion, apep, sekhmet, garuda, vajra] }
        faction: { type: string, enum: [accord, ussf] }
        scheme: { type: string, enum: [arc, strafe] }
        pace: { type: string, enum: [practice, strike] }
        mission: { type: string, enum: [skirmish, contact, beacon, warden, cage] }
        tech: { type: [string, "null"], enum: [stick, barrels, mark, null] }
        supportsOrbitalReplay: { type: boolean }
    StrikeRun:
      type: object
      required: [runId, seed, config, profile]
      properties:
        runId: { type: string, format: uuid }
        seed: { type: integer, minimum: 1 }
        profile: { $ref: "#/components/schemas/GameProfile" }
        config:
          type: object
          required: [shipId, faction, refit, pace, goal, disc, allyCount, foeCount, tech, mission]
          properties:
            shipId: { type: string, enum: [mandjet, shakuna, sundara, tripura, duskbreaker, sentinel, splitter, glide, wasp, valiant, aegis, bastion, apep, sekhmet, garuda, vajra] }
            faction: { type: string, enum: [accord, ussf] }
            refit: { type: integer, minimum: 0, maximum: 5 }
            shieldMk2: { type: boolean }
            pace: { type: string, enum: [practice, strike] }
            goal: { type: string, enum: [disc, beacons, ace, extract] }
            disc: { type: string, enum: [rust, beacon, night, dust] }
            allyCount: { type: integer, minimum: 1, maximum: 4 }
            foeCount: { type: integer, minimum: 1, maximum: 5 }
            tech: { type: [string, "null"], enum: [stick, barrels, mark, null] }
            mission: { type: string, enum: [skirmish, contact, beacon, warden, cage] }
            flightModel: { type: string, enum: [surface-v1, orbital-v1, orbital-v2, orbital-v3, orbital-v4, orbital-v5] }
    StrikeStepInput:
      type: object
      additionalProperties: false
      required: [throttle, yaw, strafe, pitch, fire, ult, lock, evade, preset]
      properties:
        throttle: { type: number, minimum: -1, maximum: 1 }
        yaw: { type: number, minimum: -1, maximum: 1 }
        strafe: { type: number, minimum: -1, maximum: 1 }
        pitch: { type: number, minimum: -1, maximum: 1 }
        fire: { type: boolean }
        ult: { type: boolean }
        lock: { type: boolean }
        evade: { type: number, minimum: -1, maximum: 1 }
        preset: { type: [integer, "null"], enum: [0, 1, 2, 3, null] }
        vertical: { type: number, minimum: -1, maximum: 1 }
        roll: { type: number, minimum: -1, maximum: 1 }
        boost: { type: boolean }
        brake: { type: boolean }
        inertial: { type: boolean }
        missile: { type: boolean }
        aimAssist: { type: boolean }
    StrikeClaimInput:
      type: object
      additionalProperties: false
      required: [inputs]
      properties:
        inputs:
          type: array
          maxItems: 21600
          items: { $ref: "#/components/schemas/StrikeStepInput" }
    StrikeClaimResult:
      type: object
      required: [gain, combat, cargo, cargoLine, advance, cleared, prices, outcome, kills, relays, profile, replayed]
      properties:
        gain: { type: integer, minimum: 0 }
        combat: { type: integer, minimum: 0 }
        cargo: { type: integer, minimum: 0 }
        cargoLine: { type: string }
        advance: { type: string }
        cleared: { type: integer, minimum: 0, maximum: 4 }
        prices: { $ref: "#/components/schemas/MarketPrices" }
        outcome: { type: string, enum: [win, loss, draw] }
        kills: { type: integer, minimum: 0 }
        relays: { type: integer, minimum: 0, maximum: 3 }
        profile: { $ref: "#/components/schemas/GameProfile" }
        replayed: { type: boolean }
    MarketPrices:
      type: object
      required: [salt, iron, dust, resin]
      properties:
        salt: { type: integer, minimum: 1 }
        iron: { type: integer, minimum: 1 }
        dust: { type: integer, minimum: 1 }
        resin: { type: integer, minimum: 1 }
    TradeGoodId:
      type: string
      enum: [salt, iron, dust, resin]
    MarketTradeInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, goodId, side, quantity]
      properties:
        idempotencyKey: { type: string, format: uuid }
        goodId: { $ref: "#/components/schemas/TradeGoodId" }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        totalLimit: { type: integer, minimum: 1 }
    MarketListing:
      type: object
      required: [goodId, name, basePrice, price, sellPrice, buyTotals, sellTotals, purpose, stock, targetStock, demandScore, modifierBps, revision, updatedAt]
      properties:
        goodId: { $ref: "#/components/schemas/TradeGoodId" }
        name: { type: string }
        basePrice: { type: integer, minimum: 1 }
        price: { type: integer, minimum: 1 }
        sellPrice: { type: integer, minimum: 1 }
        purpose: { type: string }
        restricted: { type: boolean }
        restrictionReason: { type: ["string", "null"] }
        buyTotals: { type: array, items: { type: integer, minimum: 1 }, minItems: 50, maxItems: 50 }
        sellTotals: { type: array, items: { type: integer, minimum: 1 }, minItems: 50, maxItems: 50 }
        stock: { type: integer, minimum: 0 }
        targetStock: { type: integer, minimum: 1 }
        demandScore: { type: integer, minimum: -100, maximum: 100 }
        modifierBps: { type: integer, minimum: 5000, maximum: 20000 }
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    InventoryHolding:
      type: object
      required: [goodId, quantity]
      properties:
        goodId: { $ref: "#/components/schemas/TradeGoodId" }
        quantity: { type: integer, minimum: 0 }
    MarketTransaction:
      type: object
      required: [id, goodId, side, quantity, unitPrice, total, balanceBefore, balanceAfter, inventoryBefore, inventoryAfter, stockBefore, stockAfter, marketRevision, createdAt]
      properties:
        id: { type: string, format: uuid }
        goodId: { $ref: "#/components/schemas/TradeGoodId" }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        unitPrice: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 1 }
        balanceBefore: { type: integer, minimum: 0 }
        balanceAfter: { type: integer, minimum: 0 }
        inventoryBefore: { type: integer, minimum: 0 }
        inventoryAfter: { type: integer, minimum: 0 }
        stockBefore: { type: integer, minimum: 0 }
        stockAfter: { type: integer, minimum: 0 }
        marketRevision: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    WorldEvent:
      type: object
      required: [eventId, title, description, cycleDate, startsAt, endsAt]
      properties:
        eventId: { type: string }
        title: { type: string }
        description: { type: string }
        cycleDate: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    MarketSnapshot:
      type: object
      required: [credits, inventory, listings, transactions, event, cargoUsed, cargoCapacity, rejections]
      properties:
        credits: { type: integer, minimum: 0 }
        cargoUsed: { type: integer, minimum: 0 }
        cargoCapacity: { type: integer, minimum: 1 }
        rejections: { type: array, items: { $ref: "#/components/schemas/EconomyRejection" } }
        inventory:
          type: array
          items: { $ref: "#/components/schemas/InventoryHolding" }
        listings:
          type: array
          items: { $ref: "#/components/schemas/MarketListing" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/MarketTransaction" }
        event: { $ref: "#/components/schemas/WorldEvent" }
    MarketTradeResult:
      type: object
      required: [market, transaction, replayed]
      properties:
        market: { $ref: "#/components/schemas/MarketSnapshot" }
        transaction: { $ref: "#/components/schemas/MarketTransaction" }
        replayed: { type: boolean }
    UniverseVector3:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, minimum: -100000, maximum: 100000 }
        y: { type: number, minimum: -100000, maximum: 100000 }
        z: { type: number, minimum: -100000, maximum: 100000 }
    UniverseLocation:
      type: object
      required: [id, worldLocationId, name, kind, sectorId, position]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        worldLocationId: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [asteroid, station, orbital-sector] }
        sectorId: { type: string, minLength: 1, maxLength: 80 }
        position: { $ref: "#/components/schemas/UniverseVector3" }
    UniversePresenceSummary:
      type: object
      required: [locationId, activePilots]
      properties:
        locationId: { type: string, minLength: 1, maxLength: 80 }
        activePilots: { type: integer, minimum: 0, maximum: 100000 }
    UniverseEvent:
      type: object
      required: [id, kind, locationId, status, title]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [operation-opened, match-started, match-completed, faction-event] }
        locationId: { type: string, minLength: 1, maxLength: 80 }
        operationInstanceId: { type: ["string", "null"], maxLength: 100 }
        status: { type: string, enum: [active, completed] }
        title: { type: string, minLength: 1, maxLength: 160 }
    OperationDefinition:
      type: object
      required: [id, title, description, locationId, experience, runtimeId, rulesetId, teamSize, capacity, visibility, lifecycle, access, rewardPolicy]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        locationId: { type: string, minLength: 1, maxLength: 80 }
        experience: { type: string, enum: [flight-simulation, orbital-combat, cooperative, competitive, campaign, arcade] }
        runtimeId: { type: string, minLength: 1, maxLength: 80 }
        rulesetId: { type: string, minLength: 1, maxLength: 100 }
        teamSize: { type: integer, minimum: 1, maximum: 100 }
        capacity: { type: integer, minimum: 1, maximum: 200 }
        visibility: { type: string, enum: [public, unlisted, private] }
        lifecycle: { type: string, enum: [on-demand, queued, scheduled, persistent] }
        access: { type: string, enum: [local-training, matchmaking, invitation, direct] }
        rewardPolicy: { type: string, enum: [none, existing-authority] }
    OperationInstance:
      type: object
      required: [id, operationId, locationId, phase, currentPlayers, capacity, runtimeId, rulesetId, visibility, registeredAt, expiresAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        operationId: { type: string, minLength: 1, maxLength: 100 }
        locationId: { type: string, minLength: 1, maxLength: 80 }
        phase: { type: string, enum: [assembling, ready, active, complete, closed] }
        currentPlayers: { type: integer, minimum: 0, maximum: 200 }
        capacity: { type: integer, minimum: 1, maximum: 200 }
        runtimeId: { type: string, minLength: 1, maxLength: 80 }
        rulesetId: { type: string, minLength: 1, maxLength: 100 }
        visibility: { type: string, enum: [public, unlisted] }
        registeredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    OperationRegistrationBody:
      type: object
      required: [idempotencyKey, visibility]
      properties:
        idempotencyKey: { type: string, format: uuid }
        visibility: { type: string, enum: [public, unlisted] }
    OperationRegistrationResponse:
      type: object
      required: [instance, authorization]
      properties:
        instance: { $ref: "#/components/schemas/OperationInstance" }
        authorization: { $ref: "#/components/schemas/JoinAuthorization" }
    PlayerPresence:
      type: object
      required: [publicCallsign, team, position, connected]
      properties:
        publicCallsign: { type: ["string", "null"], maxLength: 32 }
        team: { type: ["string", "null"], enum: [ussf, accord, null] }
        position:
          oneOf:
            - { $ref: "#/components/schemas/UniverseVector3" }
            - { type: "null" }
        connected: { type: boolean }
    MatchAssignment:
      type: object
      required: [assignmentId, operationInstanceId, runtimeId, rulesetId, seat, expiresAt]
      properties:
        assignmentId: { type: string, minLength: 1, maxLength: 100 }
        operationInstanceId: { type: string, minLength: 1, maxLength: 100 }
        runtimeId: { type: string, minLength: 1, maxLength: 80 }
        rulesetId: { type: string, minLength: 1, maxLength: 100 }
        seat: { type: integer, minimum: 0, maximum: 199 }
        expiresAt: { type: string, format: date-time }
    SpectatorSession:
      type: object
      required: [sessionId, operationInstanceId, readOnly, cameraModes, expiresAt]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 100 }
        operationInstanceId: { type: string, minLength: 1, maxLength: 100 }
        readOnly: { type: boolean, enum: [true] }
        cameraModes:
          type: array
          items: { type: string, enum: [overview, ussf, accord] }
        expiresAt: { type: string, format: date-time }
    JoinAuthorization:
      type: object
      required: [allowed, reason, assignment]
      properties:
        allowed: { type: boolean }
        reason: { type: string, enum: [authorized, authentication-required, operation-closed, full, ineligible, version-mismatch, not-at-location, unsupported-operation] }
        assignment:
          oneOf:
            - { $ref: "#/components/schemas/MatchAssignment" }
            - { type: "null" }
    OperationResult:
      type: object
      required: [operationInstanceId, runtimeId, rulesetId, outcome, objectives, completedAt, serverVerified]
      properties:
        operationInstanceId: { type: string, minLength: 1, maxLength: 100 }
        runtimeId: { type: string, minLength: 1, maxLength: 80 }
        rulesetId: { type: string, minLength: 1, maxLength: 100 }
        outcome: { type: string, enum: [victory, defeat, draw, abandoned] }
        objectives:
          type: array
          items:
            type: object
            required: [id, completed]
            properties:
              id: { type: string, minLength: 1, maxLength: 100 }
              completed: { type: boolean }
        completedAt: { type: string, format: date-time }
        serverVerified: { type: boolean }
    OperationDirectoryResponse:
      type: object
      required: [generatedAt, locations, operations, instances, events]
      properties:
        generatedAt: { type: string, format: date-time }
        locations:
          type: array
          items: { $ref: "#/components/schemas/UniverseLocation" }
        operations:
          type: array
          items: { $ref: "#/components/schemas/OperationDefinition" }
        instances:
          type: array
          items: { $ref: "#/components/schemas/OperationInstance" }
        events:
          type: array
          items: { $ref: "#/components/schemas/UniverseEvent" }
        presence:
          type: array
          items: { $ref: "#/components/schemas/UniversePresenceSummary" }
        presenceStatus:
          type: string
          enum: [available, unavailable]
    WorldPatrolShip:
      type: object
      required: [id, hullId, name, callsign]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        hullId:
          type: string
          enum: [mandjet, shakuna, sundara, tripura, duskbreaker, sentinel, splitter, glide]
        name: { type: string, minLength: 1, maxLength: 80 }
        callsign: { type: string, minLength: 1, maxLength: 16 }
    WorldPatrolFleet:
      type: object
      required: [id, callsign, faction, objective, locationId, route, ships, lastMovedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 180 }
        callsign: { type: string, minLength: 1, maxLength: 40 }
        faction: { type: string, enum: [ussf, accord] }
        objective: { type: string, enum: [recon, route-security, escort, supply-screen] }
        locationId: { type: string, minLength: 1, maxLength: 100 }
        route:
          type: array
          minItems: 2
          maxItems: 3
          items: { type: string, minLength: 1, maxLength: 100 }
        ships:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/WorldPatrolShip" }
        lastMovedAt: { type: string, format: date-time }
    WorldPatrolTrafficContact:
      type: object
      required: [contactId, faction, hullId, locationId, position, velocity, yaw]
      properties:
        contactId: { type: string, minLength: 1, maxLength: 220 }
        faction: { type: string, enum: [ussf, accord] }
        hullId:
          type: string
          enum: [mandjet, shakuna, sundara, tripura, duskbreaker, sentinel, splitter, glide]
        locationId: { type: string, minLength: 1, maxLength: 100 }
        position: { $ref: "#/components/schemas/UniverseVector3" }
        velocity: { $ref: "#/components/schemas/UniverseVector3" }
        yaw: { type: number, minimum: -6.284, maximum: 6.284 }
    WorldPatrolDirectory:
      type: object
      required: [generatedAt, currentLocationId, simulationLayer, patrols, traffic]
      properties:
        generatedAt: { type: string, format: date-time }
        currentLocationId: { type: string, minLength: 1, maxLength: 100 }
        simulationLayer: { type: string, enum: [strategic] }
        patrols:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/WorldPatrolFleet" }
        traffic:
          type: array
          maxItems: 512
          items: { $ref: "#/components/schemas/WorldPatrolTrafficContact" }
    WorldLocation:
      type: object
      required: [id, name, kind, x, y, unlockAfter, unlocked, explored, description, services]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [station, relay, moon, ruins, asteroid] }
        x: { type: integer, minimum: 0, maximum: 100 }
        y: { type: integer, minimum: 0, maximum: 100 }
        unlockAfter: { type: integer, minimum: 0, maximum: 4 }
        unlocked: { type: boolean }
        explored: { type: boolean }
        sector: { type: string }
        requiredTechTier: { type: integer }
        requiredRep: { type: integer }
        lockReason: { type: ["string", "null"] }
        description: { type: string }
        services:
          type: array
          items: { type: string }
    WorldQuest:
      type: object
      required: [id, title, description, requiredClear, requiredLocation, status, rewardCredits, reputationReward]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        requiredClear: { type: integer, minimum: 0, maximum: 4 }
        requiredLocation: { type: string }
        status: { type: string, enum: [locked, available, accepted, ready, claimed] }
        rewardCredits: { type: integer, minimum: 0 }
        reputationReward: { type: integer, minimum: 0 }
    WorldState:
      type: object
      required: [event, reputation, currentLocation, routes, locations, discoveries, narrative, quests, hyperdriveTier, inventory, activities, history, cargoUsed, cargoCapacity, installedUpgrades, rejections]
      properties:
        hyperdriveTier: { type: integer, minimum: 1, maximum: 3 }
        cargoUsed: { type: integer, minimum: 0 }
        cargoCapacity: { type: integer, minimum: 1 }
        installedUpgrades: { type: array, items: { type: string, enum: [shield-mk2, cargo-expansion, drive-efficiency] } }
        rejections: { type: array, items: { $ref: "#/components/schemas/EconomyRejection" } }
        inventory: { type: array, items: { $ref: "#/components/schemas/InventoryHolding" } }
        activities: { type: array, items: { $ref: "#/components/schemas/WorldActivity" } }
        history: { type: array, items: { $ref: "#/components/schemas/WorldActivityRecord" } }
        event: { $ref: "#/components/schemas/WorldEvent" }
        reputation:
          type: object
          required: [accord, ussf]
          properties:
            accord: { type: integer, minimum: -100, maximum: 100 }
            ussf: { type: integer, minimum: -100, maximum: 100 }
        currentLocation: { type: string }
        routes:
          type: array
          items: { $ref: "#/components/schemas/WorldRoute" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/WorldLocation" }
        discoveries:
          type: array
          items: { type: string }
        narrative:
          type: array
          description: Story evidence and dialogue recovered by this authenticated player through server-verified campaign outcomes.
          items: { $ref: "#/components/schemas/CampaignNarrativeRecord" }
        quests:
          type: array
          items: { $ref: "#/components/schemas/WorldQuest" }
    CampaignNarrativeDialogueLine:
      type: object
      additionalProperties: false
      required: [speaker, text]
      properties:
        speaker: { type: string, minLength: 1, maxLength: 80 }
        text: { type: string, minLength: 1, maxLength: 800 }
    CampaignNarrativeRecord:
      type: object
      additionalProperties: false
      required: [id, chapter, missionId, title, source, knowledgeLayer, synopsis, transcript, discoveredAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        chapter: { type: string, minLength: 1, maxLength: 120 }
        missionId: { type: string, enum: [contact, beacon, warden, cage, rust-disc] }
        title: { type: string, minLength: 1, maxLength: 160 }
        source: { type: string, minLength: 1, maxLength: 160 }
        knowledgeLayer: { type: string, enum: [public, restricted, classified, unresolved] }
        synopsis: { type: string, minLength: 1, maxLength: 1200 }
        transcript:
          type: array
          items: { $ref: "#/components/schemas/CampaignNarrativeDialogueLine" }
        discoveredAt: { type: string, format: date-time }
    WorldRoute:
      type: object
      required: [destinationId, costCredits, available]
      properties:
        destinationId: { type: string }
        costCredits: { type: integer, minimum: 0 }
        available: { type: boolean }
    WorldTravelInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, destinationId]
      properties:
        idempotencyKey: { type: string, format: uuid }
        destinationId: { type: string }
        maxCost: { type: integer, minimum: 0 }
