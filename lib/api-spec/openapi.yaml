      type: object
      required: [world, credits, travelCost, replayed]
      properties:
        world: { $ref: "#/components/schemas/WorldState" }
        credits: { type: integer, minimum: 0 }
        travelCost: { type: integer, minimum: 0 }
        replayed: { type: boolean }
    WorldExploreInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, format: uuid }
    WorldQuestActionInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, action]
      properties:
        idempotencyKey: { type: string, format: uuid }
        action: { type: string, enum: [accept, claim] }
    ExploreLocationResult:
      type: object
      required: [world, newlyExplored, reputationGain]
      properties:
        world: { $ref: "#/components/schemas/WorldState" }
        newlyExplored: { type: boolean }
        reputationGain: { type: integer, minimum: 0 }
    WorldQuestActionResult:
      type: object
      required: [world, credits, rewardCredits, replayed]
      properties:
        world: { $ref: "#/components/schemas/WorldState" }
        credits: { type: integer, minimum: 0 }
        rewardCredits: { type: integer, minimum: 0 }
        replayed: { type: boolean }
    WorldActivity:
      type: object
      required: [id, title, description, risk, available, reason, daily, creditCost, rewardCredits, costs, rewards, reputationDelta, rivalReputationDelta]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        risk: { type: string }
        available: { type: boolean }
        reason: { type: ["string", "null"] }
        daily: { type: boolean }
        creditCost: { type: integer, minimum: 0 }
        rewardCredits: { type: integer, minimum: 0 }
        costs: { type: array, items: { $ref: "#/components/schemas/InventoryHolding" } }
        rewards: { type: array, items: { $ref: "#/components/schemas/InventoryHolding" } }
        reputationDelta: { type: integer }
        rivalReputationDelta: { type: integer }
    EconomyRejection:
      type: object
      required: [id, action, targetId, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [trade, service] }
        targetId: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    WorldActivityRecord:
      type: object
      required: [id, title, creditsDelta, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        creditsDelta: { type: integer }
        createdAt: { type: string, format: date-time }
    WorldExplorationResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/WorldScoutEncounterResult" }
    WorldScoutEncounterResult:
      type: object
      additionalProperties: false
      required: [encounterId, missionId, sectorId, runtime, policyId, outcome, finalTick, objectiveCompleted, kills, assists, destroyedActorIds, rewardableNpcKills, creditsAwarded, fingerprint, recordedAt]
      properties:
        encounterId: { type: string, format: uuid }
        missionId: { type: string, enum: [pale-beacons, universe-patrol] }
        sectorId: { type: string, minLength: 1, maxLength: 128 }
        runtime: { type: string, minLength: 1, maxLength: 64 }
        policyId: { type: string, minLength: 1, maxLength: 128 }
        outcome: { type: string, enum: [completed, aborted] }
        finalTick: { type: integer, minimum: 0 }
        objectiveCompleted: { type: boolean }
        kills: { type: integer, minimum: 0 }
        assists: { type: integer, minimum: 0 }
        destroyedActorIds:
          type: array
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 128 }
        rewardableNpcKills: { type: integer, minimum: 0 }
        creditsAwarded: { type: integer, minimum: 0 }
        patrolId: { type: string, minLength: 1, maxLength: 128 }
        patrolLocationId: { type: string, minLength: 1, maxLength: 128 }
        opposingFaction: { type: string, enum: [ussf, accord] }
        fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        recordedAt: { type: string, format: date-time }
    WorldServiceInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, serviceId, locationId, cycleDate]
      properties:
        idempotencyKey: { type: string, format: uuid }
        serviceId: { type: string }
        creditLimit: { type: integer, minimum: 0 }
        locationId: { type: string }
        cycleDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    WorldServiceResult:
      type: object
      required: [world, credits, refit, message, replayed]
      properties:
        world: { $ref: "#/components/schemas/WorldState" }
        credits: { type: integer, minimum: 0 }
        refit: { type: integer, minimum: 0, maximum: 5 }
        message: { type: string }
        replayed: { type: boolean }

