kind = "web"
previewPath = "/"
title = "WAR FOR MARS: INFINITE WAR"
description = "A Three.js space-combat game across Rust Disc, Phobos, and Mars. Fly Accord or USSF craft, train offline in the Orbital Combat Lab, join co-op operations, and carry server-validated outcomes into campaign progression."
version = "1.0.0"
id = "artifacts/war-for-mars"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21474

[services.development]
run = "pnpm --filter @workspace/war-for-mars run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/war-for-mars", "run", "build" ]
serve = "static"
publicDir = "artifacts/war-for-mars/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21474"
BASE_PATH = "/"
