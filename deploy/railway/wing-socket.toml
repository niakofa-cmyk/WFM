# Apply only to a dedicated socket service, never the frontend or API service.
# Set WING_ALLOWED_ORIGINS before production deployment.
[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/api-server run build:socket"
watchPatterns = ["/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/deploy/railway/wing-socket.toml", "/artifacts/api-server/**", "/lib/**"]

[deploy]
startCommand = "node --enable-source-maps artifacts/api-server/dist/socket.mjs"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
