# Set this config path on a dedicated socket service in an approved test environment.
# Do not apply it to the frontend, a library, or the existing production API service.
[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/api-server run build:socket"
watchPatterns = ["/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/deploy/railway/wing-socket.toml", "/artifacts/api-server/**", "/lib/**"]

[deploy]
startCommand = "pnpm --filter @workspace/api-server run start:socket"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
